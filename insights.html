<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder Quiz · Insights</title>
<meta name="theme-color" content="#111113">
<style>
  :root{ --ink:#111113; --sub:#6e6e73; --line:#e6e6ea; --soft:#f5f5f7; --accent:#8a6a3b; }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 22px 60px;}
  .brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);}
  h1{font-size:30px;letter-spacing:-.03em;font-weight:600;margin:12px 0 6px;}
  .sub{color:var(--sub);font-size:14px;margin:0 0 26px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px;}
  .card{background:var(--soft);border-radius:16px;padding:18px 16px;}
  .card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);}
  .card .v{font-size:30px;font-weight:600;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;}
  .card .n{font-size:12px;color:#a1a1a6;margin-top:4px;}
  .sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);margin:0 0 14px;}
  .funnel{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
  .row{display:flex;align-items:center;gap:12px;}
  .row .lbl{width:92px;font-size:13px;color:var(--sub);}
  .row .track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden;}
  .row .fill{height:8px;background:var(--ink);width:0;transition:width .5s ease;}
  .row .num{width:52px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;}
  .bars{display:flex;flex-direction:column;gap:8px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-row .nm{flex:1;font-size:13.5px;}
  .bar-row .ct{width:46px;text-align:right;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .bar-row .b{width:110px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .bar-row .b i{display:block;height:6px;background:var(--accent);width:0;transition:width .5s ease;}
  .foot{font-size:12px;color:#a1a1a6;margin-top:34px;line-height:1.6;}
  .btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Cognition Insider</div>
  <h1>Quiz insights</h1>
  <p class="sub" id="stamp">Loading…</p>

  <div class="grid" id="cards"></div>

  <div class="sec">Funnel</div>
  <div class="funnel" id="funnel"></div>

  <div class="sec">Most common results</div>
  <div class="bars" id="bars"></div>

  <button class="btn" onclick="load()">Refresh</button>
  <p class="foot">Anonymous counts only — no cookies, no personal data. Numbers update in real time and refresh every 60 seconds.</p>
</div>

<script>
const NS = "ci-bq-7d3x";
const API = "https://abacus.jasoncameron.dev/get/" + NS + "/";

const FIG = [
  ["aristotle","Aristotle"],["plato","Plato"],["archimedes","Archimedes"],
  ["alexander","Alexander"],["hannibal","Hannibal"],["caesar","Caesar"],
  ["cleopatra","Cleopatra"],["leonardo","Leonardo"],["michelangelo","Michelangelo"],
  ["machiavelli","Machiavelli"],["napoleon","Napoleon"],["socrates","Socrates"],
  ["galileo","Galileo"],["newton","Newton"],["ada","Ada Lovelace"],
  ["curie","Marie Curie"],["edison","Edison"],["polom","Marco Polo"],
  ["tesla","Tesla"],["darwin","Darwin"]
];

async function getCount(key){
  try{
    const r = await fetch(API + encodeURIComponent(key) + "?t=" + Date.now());
    const j = await r.json();
    if (typeof j.value === "number") return j.value;
    return 0;
  }catch(e){ return null; }
}

const wait = ms => new Promise(r => setTimeout(r, ms));

function pct(a,b){ if(!b) return "—"; return Math.round(a/b*100) + "%"; }

async function load(){
  const stamp = document.getElementById("stamp");
  const base = {};
  for (const k of ["visits","starts","finishes","shares"]){
    base[k] = await getCount(k);
    await wait(220);
  }
  const figs = [];
  for (const [k,n] of FIG){
    const v = await getCount("f_" + k);
    figs.push([k, n, v || 0]);
    await wait(120);
  }

  const bad = Object.keys(base).some(k => base[k] === null);
  stamp.textContent = (bad ? "Some numbers failed to load · " : "Updated ") +
    new Date().toLocaleString();

  const V = base.visits || 0, S = base.starts || 0, F = base.finishes || 0, H = base.shares || 0;

  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="k">Visitors</div><div class="v">${V}</div><div class="n">sessions started</div></div>
    <div class="card"><div class="k">Tests started</div><div class="v">${S}</div><div class="n">${pct(S,V)} of visitors</div></div>
    <div class="card"><div class="k">Tests finished</div><div class="v">${F}</div><div class="n">${pct(F,S)} completion</div></div>
    <div class="card"><div class="k">Shares clicked</div><div class="v">${H}</div><div class="n">${pct(H,F)} of finishers</div></div>`;

  const rows = [["Visited",V,V],["Started",S,V],["Finished",F,V],["Shared",H,V]];
  const maxV = Math.max(V,1);
  document.getElementById("funnel").innerHTML = rows.map(([l,v,t]) => `
    <div class="row"><div class="lbl">${l}</div>
    <div class="track"><div class="fill" style="width:${Math.min(100,(v/maxV)*100)}%"></div></div>
    <div class="num">${v}</div></div>`).join("");

  const sorted = figs.slice().sort((a,b) => b[2]-a[2]);
  const maxF = Math.max(1, ...sorted.map(x => x[2]));
  document.getElementById("bars").innerHTML = sorted.map(([k,n,v]) => `
    <div class="bar-row"><div class="nm">${n}</div>
    <div class="b"><i style="width:${(v/maxF)*100}%"></i></div>
    <div class="ct">${v}</div></div>`).join("");
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
