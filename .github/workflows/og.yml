name: Build OG share cards

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/gen_og.py"
      - "tools/gen_result_pages.py"
      - "tools/patch_index_og.py"
      - ".github/workflows/og.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-core fonts-noto-extra
          python -m pip install --quiet cairosvg pillow

      - name: Patch index.html (idempotent)
        run: python tools/patch_index_og.py

      - name: Render 1200x630 cards
        run: python tools/gen_og.py --png

      - name: Build per-result share pages
        run: python tools/gen_result_pages.py

      - name: Sanity check
        run: |
          python - <<'PY'
          from PIL import Image
          import glob
          pngs = sorted(glob.glob("og/*.png"))
          assert len(pngs) >= 20, f"expected 20+ cards, got {len(pngs)}"
          for f in pngs:
              im = Image.open(f)
              assert im.size == (1200, 630), (f, im.size)
          pages = sorted(glob.glob("r/*.html"))
          assert len(pages) >= 20, f"expected 20+ result pages, got {len(pages)}"
          for f in pages:
              txt = open(f, encoding="utf-8").read()
              assert "og:image" in txt and "/og/" in txt, f
          idx = open("index.html", encoding="utf-8").read()
          assert "og:image" in idx and "function shareTarget" in idx
          print(f"ok: {len(pngs)} cards, {len(pages)} pages")
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og og-src r index.html
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: rebuild OG share cards + per-result pages"
            git push
          fi
