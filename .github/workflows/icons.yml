name: Generate PWA icons

on:
  push:
    paths:
      - "icon.svg"
      - ".github/workflows/icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render icons from SVG
        run: |
          pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          for size, name in [(192, "icon-192.png"), (512, "icon-512.png"), (180, "apple-touch-icon.png")]:
              cairosvg.svg2png(url="icon.svg", write_to=name, output_width=size, output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png
          git diff --quiet --cached || git commit -m "chore: generate PWA icons from icon.svg"
          git push
