<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7263d">
<title>Hanzi Rush — Learn Chinese, get hooked</title>
<meta name="description" content="A tiny, addictive game to learn Chinese: tones, words, radicals and sentences. 5 minutes a day.">
<link rel="stylesheet" href="style.css">
<style>
  .boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; animation: rise .5s var(--ease-out) both; }
  .boot .ring { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #ece2d0; border-top-color: var(--red); animation: spin .9s linear infinite; }
  .boot .t { margin-top: 16px; font-size: 15px; font-weight: 700; color: var(--ink-2); }
  .boot .s { margin-top: 6px; font-size: 13px; color: var(--ink-2); line-height: 1.5; max-width: 260px; }
  .boot .retry { margin-top: 18px; height: 48px; padding: 0 26px; border-radius: 16px; background: var(--red); color: #fff; font-size: 15px; font-weight: 800; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brand">汉 <span>ZI RUSH</span></div>
    <div class="pills">
      <div class="pill" id="pill-streak" title="Daily streak">🔥 <b>0</b></div>
      <div class="pill" id="pill-xp" title="Experience">⚡ <b>0</b></div>
      <div class="pill" id="pill-hearts" title="Hearts left today">❤️ <b>5</b></div>
    </div>
  </header>
  <div class="levelbar"><div class="levelfill" id="levelfill"></div></div>
  <main id="screen"></main>
</div>
<script>
// 弱网兜底：脚本按顺序加载，单个文件失败自动重试，最多 4 次；仍失败则给出重试按钮而不是空白页
(function () {
  var screen = document.getElementById('screen');
  function boot(msg) {
    screen.innerHTML = '<div class="boot"><div class="ring"></div><div class="t">Loading…</div>' + (msg ? '<div class="s">' + msg + '</div>' : '') + '</div>';
  }
  function fail() {
    screen.innerHTML = '<div class="boot"><div class="t">Couldn\u2019t load the game</div><div class="s">The connection hiccuped. Check your network and try again \u2014 your progress is saved on this device.</div><button class="retry" id="boot-retry">Try again</button></div>';
    document.getElementById('boot-retry').onclick = start;
  }
  function loadScript(src, attempt) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src + (attempt ? '?r=' + attempt : '');
      s.onload = function () { resolve(); };
      s.onerror = function () {
        s.remove();
        if (attempt < 3) { setTimeout(function () { loadScript(src, attempt + 1).then(resolve, reject); }, 500 * (attempt + 1)); }
        else reject(new Error('load failed: ' + src));
      };
      document.body.appendChild(s);
    });
  }
  function start() {
    boot();
    loadScript('data.js', 0)
      .then(function () { return loadScript('app.js', 0); })
      .catch(fail);
  }
  start();
})();
</script>
</body>
</html>
