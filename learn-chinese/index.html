<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7263d">
<title>Hanzi Rush — Learn Chinese, get hooked</title>
<meta name="description" content="A tiny, addictive game to learn Chinese: tones, words, radicals and sentences. 5 minutes a day.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brand">汉 <span>ZI RUSH</span></div>
    <div class="pills">
      <div class="pill" id="pill-streak" title="Daily streak">🔥 <b>0</b></div>
      <div class="pill" id="pill-xp" title="Experience">⚡ <b>0</b></div>
      <div class="pill" id="pill-hearts" title="Hearts left today">❤️ <b>5</b></div>
    </div>
  </header>
  <div class="levelbar"><div class="levelfill" id="levelfill"></div></div>
  <main id="screen"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
